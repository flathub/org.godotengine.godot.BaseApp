app-id: org.godotengine.godot.BaseApp
branch: '4.6'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: godot-runner

build-options:
  arch:
    x86_64:
      env:
        # Only enable link-time optimization when targeting x86_64
        # (causes issues on other architectures)
        SCONS_FLAGS_EXTRA: use_lto=yes

  env:
    # Will be appended to the version string displayed in the command-line help
    BUILD_NAME: flathub

    # SCons flags common to all builds
    # Shouldn't be quoted when used as it's a single string, not an array
    SCONS_FLAGS: >
      platform=linuxbsd
      CCFLAGS=-I/app/include
      prefix=/app
      unix_global_settings_path=/app
      disable_path_overrides=no
      progress=no
      builtin_freetype=no
      builtin_libogg=no
      builtin_libpng=no
      builtin_libtheora=no
      builtin_libvorbis=no
      builtin_libwebp=no
      builtin_openssl=no
      builtin_libvpx=no
      builtin_zlib=no
      builtin_graphite=no
      builtin_sdl=no
      udev=no

modules:
  - name: scons
    buildsystem: simple
    cleanup: ['*']

    sources:
      - type: archive
        sha256: 99c0e94a42a2c1182fa6859b0be697953db07ba936ecc9817ae0d218ced20b15
        url: https://downloads.sourceforge.net/project/scons/scons/4.10.1/SCons-4.10.1.tar.gz
        x-checker-data:
          type: anitya
          project-id: 4770
          url-template: https://downloads.sourceforge.net/project/scons/scons/$version/SCons-$version.tar.gz

    build-commands:
      - pip3 install --no-index --no-build-isolation --prefix=/app .

  - name: godot-runner
    buildsystem: simple

    sources:
      - type: archive
        sha256: e7acb6b27d6bee2525fdaa12660c602b034c25094e8a2679334601d8878a9e06
        url: https://github.com/godotengine/godot/releases/download/4.7-stable/godot-4.7-stable.tar.xz
        x-checker-data:
          type: anitya
          project-id: 373975
          url-template: https://github.com/godotengine/godot/releases/download/$version-stable/godot-$version-stable.tar.xz
          is-main-source: true

    build-commands:
      - python3 /app/bin/scons $SCONS_FLAGS $SCONS_FLAGS_EXTRA tools=no target=template_release -j "$FLATPAK_BUILDER_N_JOBS"
      - install -Dm755 bin/godot.linuxbsd.template_release.* /app/bin/godot-runner
